name: Deploy MkDocs and Digest to GitHub Pages

on:
  push:
    branches:
      - master
    paths:
      - knowledge-system/**
      - mkdocs.yml
      - digest/**
      - .github/workflows/deploy-docs.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for git-revision-date plugin if added later

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install MkDocs Material
        run: |
          pip install --upgrade pip
          pip install \
            mkdocs-material \
            pymdown-extensions

      - name: Build MkDocs site
        run: mkdocs build --verbose

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: digest/package-lock.json

      - name: Install digest dependencies
        working-directory: digest
        run: npm ci

      - name: Build digest (Cinnabar Dispatch)
        working-directory: digest
        run: npm run build

      - name: Merge digest into site/
        run: |
          mkdir -p site/digest
          cp -r digest/dist/. site/digest/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
